name: Preview Release

on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  release-assets:
    name: Build Preview Packages (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            zig_target: x86_64-linux-gnu
            binary_name: codex-auth
          - id: linux-arm64
            zig_target: aarch64-linux-gnu
            binary_name: codex-auth
          - id: darwin-x64
            zig_target: x86_64-macos-none
            binary_name: codex-auth
          - id: darwin-arm64
            zig_target: aarch64-macos-none
            binary_name: codex-auth
          - id: win32-x64
            zig_target: x86_64-windows-gnu
            binary_name: codex-auth.exe
          - id: win32-arm64
            zig_target: aarch64-windows-gnu
            binary_name: codex-auth.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Zig
        uses: Loongphy/setup-zig@node24-lts-runtime
        with:
          version: 0.16.0

      - name: Build binary
        run: zig build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe

      - name: Stage artifact bundle
        shell: bash
        run: |
          mkdir -p "artifacts/${{ matrix.id }}/binary"
          cp "zig-out/bin/${{ matrix.binary_name }}" "artifacts/${{ matrix.id }}/binary/${{ matrix.binary_name }}"

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.id }}
          path: artifacts

  publish-preview:
    name: Publish Preview Packages
    runs-on: ubuntu-latest
    needs: release-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Check versions
        run: node scripts/npm/check-versions.mjs ""

      - name: Check release metadata
        run: node scripts/npm/check-release-metadata.mjs

      - name: Stage npm packages
        run: node scripts/npm/stage-packages.mjs --artifacts-dir artifacts --output-dir dist/npm

      - name: Rewrite root preview optional dependencies
        run: >
          node scripts/npm/rewrite-preview-optional-dependencies.mjs
          --root-dir ./dist/npm/root
          --repository ${{ github.repository }}
          --pr-number ${{ github.event.pull_request.number }}
          --sha ${{ github.event.pull_request.head.sha }}

      - name: Publish preview packages
        run: >
          npx pkg-pr-new publish --bin --commentWithSha
          ./dist/npm/root
          ./dist/npm/codex-auth-linux-x64
          ./dist/npm/codex-auth-linux-arm64
          ./dist/npm/codex-auth-darwin-x64
          ./dist/npm/codex-auth-darwin-arm64
          ./dist/npm/codex-auth-win32-x64
          ./dist/npm/codex-auth-win32-arm64

      - name: Normalize preview comment command
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const comment = comments
              .reverse()
              .find(({ body, user }) =>
                user?.type === "Bot" &&
                body?.includes("pkg.pr.new") &&
                body?.includes("npx https://pkg.pr.new/")
              );

            if (!comment) {
              core.info("No pkg.pr.new comment needs normalization.");
              return;
            }

            const body = comment.body.replaceAll(
              "npx https://pkg.pr.new/",
              "npx -y https://pkg.pr.new/",
            );

            if (body === comment.body) {
              core.info("pkg.pr.new comment is already normalized.");
              return;
            }

            try {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: comment.id,
                body,
              });
            } catch (error) {
              if (error.status === 403) {
                core.warning("pkg.pr.new comment normalization skipped: GitHub token cannot update this bot comment.");
                return;
              }
              throw error;
            }
